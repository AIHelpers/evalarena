<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvalArena · Dataset Evaluation</title>
<link rel="stylesheet" href="/style.css">
<style>
  .run-row { cursor: pointer; }
  .run-row:hover { background: #f0f0f7; }
  .pos { color: #15803d; font-weight: 600; }
  .neg { color: #b91c1c; font-weight: 600; }
  .item-results { margin-top: 16px; }
  .item-results details { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
  .item-results summary { cursor: pointer; font-weight: 600; }
  .item-results pre { white-space: pre-wrap; font-size: 13px; background: #f7f7f9; padding: 10px; border-radius: 6px; }
  .score-pill { display: inline-block; min-width: 44px; text-align: center; border-radius: 20px; padding: 2px 8px; font-size: 12px; }
  .score-good { background: #dcfce7; color: #15803d; }
  .score-mid  { background: #fef9c3; color: #a16207; }
  .score-bad  { background: #fee2e2; color: #b91c1c; }
  .summary-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; margin: 14px 0; }
  .summary-card .card h3 { margin-top: 0; font-size: 13px; }
  .summary-card .card p { margin: 3px 0; }
  .summary-card .card .val { font-size: 24px; font-weight: 700; }
  .back-link { color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; margin-bottom: 12px; display: inline-block; }
  .run-form { max-width: 760px; }
  .run-form .form { max-width: 100%; }
  .response-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .response-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--card); }
  .response-item summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .response-item textarea { width: 100%; min-height: 60px; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; margin-top: 8px; }
  .response-item .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .response-item label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .toolbar .spacer { flex: 1; }
  .btn-secondary { background: none; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .btn-secondary:hover { background: #f0f0f7; }
</style>
</head>
<body>
  <header>
    <h1>📊 EvalArena</h1>
    <nav>
      <a class="nav-btn" href="/">⚔️ Arena</a>
      <button id="nav-runs" class="nav-btn active">Evaluation Runs</button>
      <button id="nav-compare" class="nav-btn">Compare</button>
    </nav>
  </header>

  <main id="app">
    <h2>Loading…</h2>
  </main>

<script>
const app = document.getElementById('app');

document.getElementById('nav-runs').addEventListener('click', () => { setActive('nav-runs'); renderRuns(); });
document.getElementById('nav-compare').addEventListener('click', () => { setActive('nav-compare'); renderCompare(); });

function setActive(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function api(path, opts) {
  return fetch('/api' + path, opts).then(async r => {
    const body = await r.json().catch(() => null);
    if (!r.ok) throw new Error((body && body.error) || r.statusText);
    return body;
  });
}

function esc(s) {
  const codes = {'&': 38, '<': 60, '>': 62, '"': 34, "'": 39};
  return String(s).replace(/[&<>"']/g, c => '&#' + codes[c] + ';');
}

function scoreClass(score) {
  if (score >= 0.75) return 'score-good';
  if (score >= 0.5) return 'score-mid';
  return 'score-bad';
}

function scorePill(score) {
  return `<span class="score-pill ${scoreClass(score)}">${(score*100).toFixed(0)}</span>`;
}

// ---------- Runs list ----------

async function renderRuns() {
  app.innerHTML = '<h2>Evaluation Runs</h2><p class="muted">Loading…</p>';
  try {
    const runs = await api('/eval-runs');
    if (!runs || runs.length === 0) {
      app.innerHTML = `
        <h2>Evaluation Runs</h2>
        <p class="muted">No evaluation runs yet.</p>
        <button id="new-run" class="primary">+ Create first evaluation run</button>`;
      document.getElementById('new-run').addEventListener('click', renderNewRun);
      return;
    }
    let html = `<div class="toolbar"><h2 style="margin:0">Evaluation Runs</h2><div class="spacer"></div><button id="new-run" class="btn-secondary">+ New Run</button></div>`;
    html += '<table><thead><tr><th>Run</th><th>Model</th><th>Dataset</th><th>Overall</th><th>N</th><th>Mode</th><th>Created</th></tr></thead><tbody>';
    runs.forEach(r => {
      const overall = r.overall != null ? scorePill(r.overall) : '<span class="muted">—</span>';
      html += `<tr class="run-row" data-id="${esc(r.id)}">
        <td><code>${esc(r.id)}</code></td><td>${esc(r.model_label)}</td><td><code>${esc(r.dataset_id)}</code></td>
        <td>${overall}</td><td>${r.n}</td><td>${esc(r.scorer_mode)}</td><td>${esc(r.created_at)}</td></tr>`;
    });
    html += '</tbody></table>';
    app.innerHTML = html;
    document.getElementById('new-run').addEventListener('click', renderNewRun);
    app.querySelectorAll('.run-row').forEach(row =>
      row.addEventListener('click', () => renderRunDetail(row.dataset.id)));
  } catch (e) {
    app.innerHTML = '<h2>Evaluation Runs</h2><p class="muted">Failed to load: ' + esc(e.message) + '</p>';
  }
}

// ---------- New Run form ----------

async function renderNewRun() {
  app.innerHTML = '<h2>New Evaluation Run</h2><p class="muted">Loading datasets…</p>';
  try {
    const datasets = await api('/datasets');
    if (!datasets || datasets.length === 0) {
      app.innerHTML = '<h2>New Evaluation Run</h2><p class="muted">No datasets imported yet. Import one with the CLI: <code>evalarena dataset import --file golden_eval_set.jsonl --name my-data</code></p><a class="back-link" onclick="renderRuns()">← Back to runs</a>';
      return;
    }
    let html = `<a class="back-link" onclick="renderRuns()">← Back to runs</a>`;
    html += `<h2>New Evaluation Run</h2>`;
    html += `<div class="run-form form">`;
    html += `<label>Dataset
      <select id="run-dataset">
        ${datasets.map(d => `<option value="${esc(d.id)}">${esc(d.name)} (${d.item_count} items)</option>`).join('')}
      </select></label>`;
    html += `<label>Model label <input id="run-label" placeholder="claude-sonnet-4-6" required></label>`;
    html += `<label>Notes (optional) <input id="run-notes" placeholder="e.g. finetune round 3"></label>`;
    html += `<label><input type="checkbox" id="run-judge"> Use LLM rubric judge (if configured)</label>`;
    html += `<div id="run-responses"><p class="muted">Select a dataset to load its items…</p></div>`;
    html += `<button id="run-submit" class="primary">Run evaluation</button>`;
    html += `</div>`;
    app.innerHTML = html;

    const dsSelect = document.getElementById('run-dataset');
    dsSelect.addEventListener('change', () => loadResponsesFor(dsSelect.value));

    // Populate initial responses for the first dataset
    await loadResponsesFor(dsSelect.value);

    document.getElementById('run-submit').addEventListener('click', submitNewRun);
  } catch (e) {
    app.innerHTML = '<h2>New Evaluation Run</h2><p class="muted">Failed to load: ' + esc(e.message) + '</p>';
  }
}

async function loadResponsesFor(datasetId) {
  const container = document.getElementById('run-responses');
  if (!container) return;
  container.innerHTML = '<p class="muted">Loading dataset items…</p>';
  try {
    // Fetch the full dataset to get its items.
    const dsRaw = await fetch('/api/datasets/' + datasetId).then(r => r.json());
    const items = dsRaw.items || [];
    let html = '<h3 style="margin:14px 0 8px">Responses for each item</h3>';
    html += '<div class="response-fields">';
    items.forEach((it, i) => {
      const typeHint = {code_generation: 'code', bug_fix: 'code', conceptual: 'text', multiple_choice: 'e.g. "A"'}[it.type] || 'text';
      html += `<details class="response-item" ${i===0?'open':''}>
        <summary><code>${esc(it.id)}</code> <span class="muted">· ${esc(it.type)} · ${esc(it.category)}</span></summary>
        <p class="meta">${esc(it.question || '(no question)')}</p>
        <label>Response
          <textarea data-item-id="${esc(it.id)}" placeholder="${esc(typeHint)}"></textarea>
        </label>
      </details>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<p class="muted">Failed to load dataset items: ' + esc(e.message) + '</p>';
  }
}

async function submitNewRun() {
  const label = document.getElementById('run-label').value.trim();
  const notes = document.getElementById('run-notes').value.trim();
  const dsId = document.getElementById('run-dataset').value;
  const useJudge = document.getElementById('run-judge').checked;
  if (!label) { alert('Model label is required'); return; }

  // Collect responses from textareas (non-empty only).
  const responses = {};
  document.querySelectorAll('#run-responses textarea[data-item-id]').forEach(ta => {
    const v = ta.value.trim();
    if (v) responses[ta.getAttribute('data-item-id')] = v;
  });
  if (Object.keys(responses).length === 0) {
    alert('Enter at least one response before running the evaluation.');
    return;
  }

  const btn = document.getElementById('run-submit');
  btn.disabled = true;
  btn.textContent = 'Running…';
  try {
    const result = await api('/eval-runs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({dataset_id: dsId, model_label: label, responses, use_rubric_judge: useJudge, notes}),
    });
    const runId = result.run && result.run.id;
    if (runId) {
      alert(`Evaluation run created: ${runId}`);
      renderRunDetail(runId);
    } else {
      renderRuns();
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Run evaluation';
    alert('Failed to create evaluation run: ' + e.message);
  }
}

// ---------- Run detail ----------

async function renderRunDetail(runId) {
  app.innerHTML = '<h2>Run</h2><p class="muted">Loading…</p>';
  try {
    const run = await api('/eval-runs/' + runId);
    const s = run.summary || {};
    const n = s.n != null ? s.n : (run.results || []).length;

    const cards = [
      ['Overall', s.overall != null ? (s.overall*100).toFixed(1) + '%' : '—'],
      ['Items', String(n)],
      ['Model', run.model_label || '—'],
      ['Mode', run.scorer_mode || '—'],
    ];

    const byCat = Object.entries(s.by_category || {}).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${scorePill(v)}</td></tr>`).join('');
    const byType = Object.entries(s.by_type || {}).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${scorePill(v)}</td></tr>`).join('');

    let html = `<a class="back-link" onclick="renderRuns()">← Back to runs</a>`;
    html += `<h2>Run <code>${esc(run.id)}</code></h2>`;
    html += `<div class="summary-card">${cards.map(([k,v]) => `<div class="card"><h3>${k}</h3><p class="val">${v}</p></div>`).join('')}</div>`;
    if (byCat) html += `<div class="summary-card"><div class="card"><h3>By Category</h3><table><tbody>${byCat}</tbody></table></div></div>`;
    if (byType) html += `<div class="summary-card"><div class="card"><h3>By Type</h3><table><tbody>${byType}</tbody></table></div></div>`;

    html += '<h3>Per-item results</h3><div class="item-results">';
    (run.results || []).forEach(res => {
      const parts = ['score'];
      const meta = [];
      if (res.mc_chosen) meta.push(`MC: ${esc(res.mc_chosen)}${res.mc_correct != null ? (res.mc_correct ? ' ✓' : ' ✗') : ''}`);
      if (res.gofmt_valid != null) meta.push(`gofmt: ${res.gofmt_valid ? 'ok' : 'invalid'}`);
      meta.push(`rubric ${res.rubric_hits}/${res.rubric_total}`);
      if (res.scorer_type) meta.push(esc(res.scorer_type));
      html += `<details>
        <summary><code>${esc(res.item_id)}</code> ${scorePill(res.score)} <span class="muted">· ${meta.join(' · ')}</span></summary>
        ${res.judge_rationale ? `<p class="muted">Rationale: ${esc(res.judge_rationale)}</p>` : ''}
        <pre>${esc(res.response || '(no response)')}</pre>
      </details>`;
    });
    html += '</div>';
    app.innerHTML = html;
  } catch (e) {
    app.innerHTML = '<h2>Run</h2><p class="muted">Failed to load: ' + esc(e.message) + '</p>';
  }
}

// ---------- Compare ----------

async function renderCompare() {
  app.innerHTML = '<h2>Compare Runs</h2><p class="muted">Loading…</p>';
  try {
    const runs = await api('/eval-runs');
    if (runs.length < 2) {
      app.innerHTML = '<h2>Compare Runs</h2><p class="muted">Need at least 2 runs to compare.</p>';
      return;
    }
    let html = '<h2>Compare Runs</h2><p>Pick two or more runs by model label:</p><div class="form" style="max-width:640px">';
    runs.forEach(r => {
      html += `<label><input type="checkbox" class="cmp-sel" value="${esc(r.id)}" data-label="${esc(r.model_label)}"> ${esc(r.model_label)} <span class="muted">(<code>${esc(r.id)}</code>, overall ${r.overall != null ? (r.overall*100).toFixed(1)+'%' : '—'})</span></label>`;
    });
    html += '<button id="go-compare" class="primary">Compare selected</button></div><div id="compare-out"></div>';
    app.innerHTML = html;
    document.getElementById('go-compare').addEventListener('click', async () => {
      const ids = [...document.querySelectorAll('.cmp-sel:checked')].map(c => c.value);
      if (ids.length < 2) { alert('Select at least 2 runs'); return; }
      const out = document.getElementById('compare-out');
      out.innerHTML = '<p class="muted">Comparing…</p>';
      try {
        const cmp = await api('/eval-runs/compare?ids=' + ids.join(','));
        renderCompareResult(cmp, out);
      } catch (e) {
        out.innerHTML = '<p class="muted">Failed: ' + esc(e.message) + '</p>';
      }
    });
  } catch (e) {
    app.innerHTML = '<h2>Compare Runs</h2><p class="muted">Failed to load: ' + esc(e.message) + '</p>';
  }
}

function renderCompareResult(cmp, out) {
  let html = '<h3>Overall</h3><table><thead><tr><th>Run</th><th>Label</th><th>Overall</th></tr></thead><tbody>';
  (cmp.run_ids || []).forEach((rid, i) => {
    const label = (cmp.model_labels && cmp.model_labels[i]) || rid;
    const overall = cmp.overall_by_run[rid];
    html += `<tr><td><code>${esc(rid)}</code></td><td>${esc(label)}</td><td>${overall != null ? scorePill(overall) : '—'}</td></tr>`;
  });
  html += '</tbody></table>';

  html += '<h3>Category deltas</h3><table><thead><tr><th>Category</th>';
  (cmp.run_ids || []).forEach(rid => {
    const i = cmp.run_ids.indexOf(rid);
    html += `<th>${esc((cmp.model_labels && cmp.model_labels[i]) || rid)}</th>`;
  });
  html += '</tr></thead><tbody>';
  Object.entries(cmp.category_delta || {}).forEach(([cat, byRun]) => {
    html += `<tr><td>${esc(cat)}</td>`;
    (cmp.run_ids || []).forEach(rid => {
      const v = byRun[rid];
      html += `<td>${v != null ? scorePill(v) : '—'}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';

  if (cmp.regressions && cmp.regressions.length) {
    html += '<h3>Regressions <span class="neg">▼</span></h3><table><thead><tr><th>Item</th><th>Category</th><th>Score A</th><th>Score B</th><th>Delta</th></tr></thead><tbody>';
    cmp.regressions.forEach(d => {
      html += `<tr><td><code>${esc(d.item_id)}</code></td><td>${esc(d.category)}</td><td>${d.score_a.toFixed(2)}</td><td>${d.score_b.toFixed(2)}</td><td class="neg">${d.delta.toFixed(2)}</td></tr>`;
    });
    html += '</tbody></table>';
  }

  if (cmp.improvements && cmp.improvements.length) {
    html += '<h3>Improvements <span class="pos">▲</span></h3><table><thead><tr><th>Item</th><th>Category</th><th>Score A</th><th>Score B</th><th>Delta</th></tr></thead><tbody>';
    cmp.improvements.forEach(d => {
      html += `<tr><td><code>${esc(d.item_id)}</code></td><td>${esc(d.category)}</td><td>${d.score_a.toFixed(2)}</td><td>${d.score_b.toFixed(2)}</td><td class="pos">${d.delta.toFixed(2)}</td></tr>`;
    });
    html += '</tbody></table>';
  }

  out.innerHTML = html;
}

renderRuns();
</script>
</body>
</html>
